; ============================================================================
;  ARBOLOK / Arbolog v4  –  PlatformIO
;
;  Sestavení a nahrání (výchozí pin BIAS sondy = GPIO32, stará deska):
;      pio run -e esp32doit-devkit-v1 -t upload
;  Nová deska (výchozí pin BIAS = GPIO26, to je DAC2):
;      pio run -e nova-deska -t upload
;  Od verze 4.3 je volba prostředí jen VÝCHOZÍ: správný pin BIAS (32, 26, případně 25) si zařízení najde samo
;  při prvním spuštění webu a uloží (Nastavení -> Zapojení sondy), takže stačí kterékoli prostředí.
;  Ladění po sériové lince (výpisy měření a spánku, 115200 Bd):
;      pio run -e ladeni -t upload && pio device monitor
;
;  NAHRÁVÁNÍ PŘES OTA (bez kabelu): sestavit `pio run`, soubor
;      .pio/build/esp32doit-devkit-v1/firmware.bin
;  (na konci sestavení ho skript zkontroluje a vypíše výsledek) nahrát na
;  http://10.10.10.10/update (po připojení k Wi-Fi zařízení; stránka má jediný formulář "Firmware").
;  Podrobně a včetně nouzového režimu: README.md, kapitola "Nahrávání přes OTA".
;
;  Souborový systém (LittleFS) se NEMUSÍ nahrávat: stránka je součástí firmwaru
;  a log si vytvoří zařízení samo. (Starší chart.js / style.css z verze 3 už nejsou
;  potřeba, jdou smazat ve stránce "Soubory".)
; ============================================================================

[platformio]
default_envs = esp32doit-devkit-v1

[env]
; PLATFORMA JE ZAFIXOVANÁ NA PŘESNOU VERZI. Zápis "platform = espressif32" bez verze si při čisté instalaci
; PlatformIO přeloží na nejnovější vydání. Takhle se verze 4.1 sestavila s platformou 8.0.0 (Arduino-ESP32 3.3.12,
; ESP-IDF 5.5.5), a ta překládá "release" bez jakékoli optimalizace (-O0): firmware vyšel 1 342 719 B a nevešel
; se do oddílu pro OTA (1 310 720 B). Proti tomu je níže -Os; ověřit jde výpisem "VELIKOST FIRMWARU" po sestavení.
platform = espressif32@8.0.0
; Plán B (NEZKOUŠENO), kdyby se s touto platformou něco chovalo jinak než ve verzi 3: prostředí, jaké měla (podle verzí
; balíčků v mapě) verze 3 (pioarduino, Arduino-ESP32 3.2.0 / ESP-IDF 5.4.1). Odkomentovat NAMÍSTO řádku výše.
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
;upload_port = /dev/cu.usbserial-10

; Verze knihoven jsou pevně dané (API ESPAsyncWebServer se mezi verzemi mění).
; ESP32Time a ArduinoJson už se nepoužívají.
lib_deps =
  adafruit/RTClib@^2.1.4
  ESP32Async/ESPAsyncWebServer@3.8.1
  ESP32Async/AsyncTCP@3.4.9
  ipdotsetaf/ESPAsyncHTTPUpdateServer@3.0.0

; Stejné příznaky OTA knihovny jako ve verzi 3 (sestavení, které jde u tebe prokazatelně nahrát).
; -DESPASYNCHTTPUPDATESERVER_LITTLEFS záměrně NENÍ zapnuto: ruční nahrání s "?name=filesystem" (stránka
; /update ho sama nenabízí) by pak nemělo nic přepsat (jinak by přepsalo oddíl se souborovým systémem a smazalo log).
; -Os = optimalizace na velikost. build_unflags pro jistotu odstraní jiné úrovně optimalizace, aby platila jen tahle.
build_unflags =
  -O0
  -Og
  -O1
  -O2
  -O3
build_flags =
  -Os
  -DESPASYNCHTTPUPDATESERVER_MODE=1
  ; ARBOLOG_BOARD jen volí VÝCHOZÍ pin BIAS (1 = GPIO32, 2 = GPIO26); skutečný pin se zjistí za běhu (viz výše).
  -DARBOLOG_BOARD=1
  ; Heslo Wi-Fi (min. 8 znaků) – zrušte komentář a nastavte vlastní. Stejné heslo
  ; chrání stránku /update (uživatel "admin"). Bez něj je síť otevřená jako ve verzi 3.
  ;-DAP_PASSWORD=\"zmenmeheslo\"

; pre:  z adresáře web/ se znovu vygeneruje src/web_assets.h
; post: po sestavení se firmware.bin zkontroluje (platný obraz ESP32, velikost vůči limitu OTA 1 306 624 B,
;       je to verze 4 s nouzovým režimem); stejnou kontrolu jde spustit ručně: python3 tools/check_bin.py soubor.bin
extra_scripts =
  pre:tools/pio_pre.py
  post:tools/pio_post.py

[env:esp32doit-devkit-v1]

[env:nova-deska]
build_flags =
  ${env.build_flags}
  -UARBOLOG_BOARD
  -DARBOLOG_BOARD=2

[env:ladeni]
build_flags =
  ${env.build_flags}
  -DARBOLOG_DEBUG=1
monitor_filters = esp32_exception_decoder
